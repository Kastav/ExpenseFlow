name: Build ExpenseFlow Android App Bundle (AAB)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Android App Bundle
    # Pin to Ubuntu 24.04 for reproducibility; validate Ubuntu 26.04 before migrating.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run automated tests
        run: bun run test

      - name: Build web production assets
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses (non-interactive)
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 141 ]; then
            echo "sdkmanager --licenses failed with exit code $STATUS"
            exit "$STATUS"
          fi

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB)
        run: cd android && ./gradlew bundleRelease --stacktrace

      - name: Sign release AAB when signing secrets are configured
        id: sign_step
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing release AAB..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore android/app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$AAB" "$KEY_ALIAS"
            mv "$AAB" android/app/build/outputs/bundle/release/expenseflow-signed-release.aab
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::AAB signed successfully."
          else
            echo "::warning::Signing secrets are not configured; the AAB will be unsigned and is not ready for Play Console upload."
            mv "$AAB" android/app/build/outputs/bundle/release/expenseflow-unsigned-build.aab
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: expenseflow-android-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
